name: ML Pipeline (ClearML)

# ─────────────────────────────────────────────────────────────────────────────
# Trigger — fires when ML scripts change
# ─────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "s1_rebuild.py"
      - "s2_preprocess.py"
      - "s3_train_model.py"
      - "s4_hpo.py"
      - "s5_final_model.py"
      - "pipeline_controller.py"

  workflow_dispatch:

jobs:

  trigger-clearml:
    name: Trigger ClearML Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install ClearML
        run: pip install clearml

      - name: Configure ClearML credentials
        env:
          CLEARML_API_HOST:       ${{ secrets.CLEARML_API_HOST }}
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        run: |
          cat > ~/clearml.conf << EOF
          api {
              web_server:   ${CLEARML_API_HOST/api./app.}
              api_server:   ${CLEARML_API_HOST}
              files_server: ${CLEARML_API_HOST/api./files.}
              credentials {
                  access_key: "${CLEARML_API_ACCESS_KEY}"
                  secret_key: "${CLEARML_API_SECRET_KEY}"
              }
          }
          EOF
          echo "ClearML credentials written."

      - name: Verify ClearML connection
        env:
          CLEARML_API_HOST:       ${{ secrets.CLEARML_API_HOST }}
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        run: |
          python -c "
          from clearml import Task
          t = Task.init(
              project_name='Banana Ripeness',
              task_name='CI/CD connection check',
              task_type=Task.TaskTypes.testing,
              reuse_last_task_id=False
          )
          t.close()
          print('ClearML connection OK')
          "

      # ── Enqueue pipeline on ClearML — SageMaker agent picks it up ──────────
      # This does NOT run the pipeline locally in GitHub Actions.
      # It registers the pipeline task in ClearML and marks it as 'queued'.
      # Your SageMaker machine running clearml-agent picks it up and runs it
      # with the actual data and GPU.
      - name: Enqueue ClearML pipeline
        env:
          CLEARML_API_HOST:       ${{ secrets.CLEARML_API_HOST }}
          CLEARML_API_ACCESS_KEY: ${{ secrets.CLEARML_API_ACCESS_KEY }}
          CLEARML_API_SECRET_KEY: ${{ secrets.CLEARML_API_SECRET_KEY }}
        run: |
          python -c "
          from clearml import Task
          from clearml.automation import PipelineController

          print('Creating pipeline task in ClearML...')

          pipe = PipelineController(
              name='Banana Ripeness Pipeline',
              project='Banana Ripeness',
              version='4.1',
              add_pipeline_tags=True,
              default_execution_queue='default',
          )

          pipe.add_step(
              name='stage_data',
              base_task_project='Banana Ripeness',
              base_task_name='Pipeline step 1 dataset',
              execution_queue='default',
          )
          pipe.add_step(
              name='stage_process',
              parents=['stage_data'],
              base_task_project='Banana Ripeness',
              base_task_name='Pipeline step 2 process dataset',
              execution_queue='default',
          )
          pipe.add_step(
              name='stage_train',
              parents=['stage_process'],
              base_task_project='Banana Ripeness',
              base_task_name='Pipeline step 3 train model',
              execution_queue='default',
          )
          pipe.add_step(
              name='stage_hpo',
              parents=['stage_process'],
              base_task_project='Banana Ripeness',
              base_task_name='Pipeline step 4 hpo',
              execution_queue='default',
          )
          pipe.add_step(
              name='stage_final',
              parents=['stage_train', 'stage_hpo'],
              base_task_project='Banana Ripeness',
              base_task_name='Pipeline step 5 final model',
              execution_queue='default',
          )

          pipe.start(queue='default')
          print('Pipeline enqueued in ClearML!')
          print('View: https://app.clear.ml')
          print('To run: clearml-agent daemon --queue default --foreground')
          "
