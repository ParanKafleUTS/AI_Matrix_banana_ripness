name: Deploy (Free Tier)

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "static/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "vercel.json"
      - "hf_upload.py"
  workflow_dispatch:

jobs:

  deploy-huggingface:
    name: Backend to HF Spaces
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload files to HF Space
        run: python hf_upload.py
        env:
          HF_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}

  deploy-frontend:
    name: Frontend to Vercel
    runs-on: ubuntu-latest
    needs: deploy-huggingface
    if: always()
    steps:
      - uses: actions/checkout@v4

      - name: Inject API URL
        run: sed -i "s|const API = '';|const API = '${{ secrets.BACKEND_URL }}';|g" static/index.html

      - run: npm install -g vercel@latest

      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: cd static && vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
