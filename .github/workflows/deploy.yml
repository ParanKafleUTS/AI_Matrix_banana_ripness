name: Deploy (Free Tier)

on:
  push:
    branches: [main]
    paths:
      # Only re-deploy the app when these files change.
      # ML pipeline changes (s1–s5, pipeline_controller) won't trigger a redeploy.
      - "main.py"
      - "static/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "railway.toml"
      - "vercel.json"
  workflow_dispatch:

# ─────────────────────────────────────────────────────────────────────────────
# CHOOSE YOUR BACKEND:
#   Option A — Hugging Face Spaces  (recommended: 16 GB RAM, always on, free)
#   Option B — Render               (512 MB RAM, sleeps after 15 min, free)
#
# Set the DEPLOY_TARGET secret in GitHub to "huggingface" or "render".
# Default is "huggingface".
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ── Option A: Deploy backend to Hugging Face Spaces ────────────────────────
  deploy-huggingface:
    name: Backend → Hugging Face Spaces
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TARGET != 'render' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true       # needed if model .pth files are tracked with Git LFS

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name  "GitHub Actions"
          # Embed token directly in URL — works without interactive auth
          git remote add hf https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME} || \
          git remote set-url hf https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}
          git push hf main --force

  # ── Option B: Deploy backend to Render ─────────────────────────────────────
  deploy-render:
    name: Backend → Render
    runs-on: ubuntu-latest
    if: ${{ vars.DEPLOY_TARGET == 'render' }}

    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" | jq .
          # Get your deploy hook from:
          # Render dashboard → your service → Settings → Deploy Hook

  # ── Deploy frontend to Vercel (free) — runs after backend ──────────────────
  deploy-frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [deploy-huggingface, deploy-render]
    if: always()   # run even if one backend job was skipped

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject backend API URL into frontend
        run: |
          # Replace  const API = '';  with the real backend URL.
          # For HF Spaces the URL looks like:
          #   https://YOUR_USERNAME-YOUR_SPACE_NAME.hf.space
          # For Render:
          #   https://banana-ripeness-api.onrender.com
          sed -i "s|const API = '';|const API = '${{ secrets.BACKEND_URL }}';|g" static/index.html
          grep "const API" static/index.html

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy frontend to Vercel
        run: vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
