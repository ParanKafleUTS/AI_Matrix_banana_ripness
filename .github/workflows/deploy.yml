name: Deploy (Free Tier)

on:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "static/**"
      - "requirements*.txt"
      - "Dockerfile"
      - "vercel.json"
  workflow_dispatch:

jobs:

  # ── Deploy backend to Hugging Face Spaces ──────────────────────────────────
  deploy-huggingface:
    name: Backend → Hugging Face Spaces
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install huggingface_hub
        run: pip install huggingface_hub

      - name: Upload files to HF Space
        env:
          HUGGING_FACE_HUB_TOKEN:      ${{ secrets.HF_TOKEN }}
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          python - << 'PYEOF'
          import os
          from huggingface_hub import HfApi

          token      = os.environ["HF_TOKEN"]
          username   = os.environ["HF_USERNAME"]
          space_name = os.environ["HF_SPACE_NAME"]
          repo_id    = f"{username}/{space_name}"

          api = HfApi()

          # Files to upload to the Space (no model .pth files — uploaded separately)
          files = [
              ("main.py",               "main.py"),
              ("requirements-prod.txt", "requirements-prod.txt"),
              ("Dockerfile",            "Dockerfile"),
              ("README.md",             "README.md"),
              ("static/index.html",     "static/index.html"),
          ]

          for local_path, repo_path in files:
              if os.path.exists(local_path):
                  print(f"Uploading {local_path} → {repo_path}")
                  api.upload_file(
                      path_or_fileobj = local_path,
                      path_in_repo    = repo_path,
                      repo_id         = repo_id,
                      repo_type       = "space",
                  )
                  print(f"  ✓ {repo_path}")
              else:
                  print(f"  ⚠ skipping {local_path} (not found)")

          print("Upload complete — HF Space will rebuild automatically.")
          PYEOF

  # ── Deploy frontend to Vercel ───────────────────────────────────────────────
  deploy-frontend:
    name: Frontend → Vercel
    runs-on: ubuntu-latest
    needs: deploy-huggingface
    if: always()

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject backend API URL
        run: |
          sed -i "s|const API = '';|const API = '${{ secrets.BACKEND_URL }}';|g" static/index.html
          grep "const API" static/index.html

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel project settings
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        run: |
          cd static
          vercel deploy --prod --archive=tgz --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID:     ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
